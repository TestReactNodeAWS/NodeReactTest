# Local stack: Postgres, migrations, backend, and (once it exists) the web app.
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml --profile web up --build   # include the web app
name: lab

x-db-settings: &db-settings
  DB_HOST: db
  DB_PORT: '5432'
  DB_USER: lab
  DB_PASSWORD: lab
  DB_DATABASE: lab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    # Published on 5433 so it doesn't clash with a Postgres already installed on the laptop.
    # Containers in this stack still reach it as db:5432.
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits, like the SkyU liquibase pipeline that goes first in every release.
  liquibase:
    build:
      context: ..
      dockerfile: docker/liquibase.Dockerfile
    environment: *db-settings
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *db-settings
      NODE_ENV: production
      APP_NAME: lab-backend
      PORT: '5010'
      CORS_ALLOWED: http://localhost:3000,http://localhost:8080
    ports:
      - '5010:5010'
    depends_on:
      liquibase:
        condition: service_completed_successfully

  web:
    profiles: ['web']
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      REACT_APP_API_URL: http://localhost:5010/api/v2
    ports:
      - '8080:80'
    depends_on:
      - backend
