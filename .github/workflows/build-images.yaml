# Builds, scans and pushes the three images, replacing SkyU's build-and-push job.
# Images are tagged with the commit SHA (like SkyU) and, on release branches, the release name
# (like RTC's docker-build.yaml). Uses GHCR while learning; switch to AWS ECR in stage 6.
name: Build images

on:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, liquibase, web]
    steps:
      - uses: actions/checkout@v4

      - name: Work out names and tags
        id: meta
        run: |
          if [ "${{ matrix.image }}" = "web" ] && [ ! -f packages/web/package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"          # GHCR names must be lowercase
          repo="$(basename "${GITHUB_REPOSITORY,,}")"
          image="ghcr.io/${owner}/${repo}-${{ matrix.image }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          tags="${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_NAME" == releases/* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME#releases/}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.meta.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally so it can be scanned before pushing)
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan the image
        if: steps.meta.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@0.28.0 # pin to a commit SHA before relying on this
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: steps.meta.outputs.skip != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS//,/ }; do docker push "$tag"; done
