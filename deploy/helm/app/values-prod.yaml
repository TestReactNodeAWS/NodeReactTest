# prod: like RTC's web.realtimeconveyancer.com.au.
backend:
  replicas: 2
  env:
    CORS_ALLOWED: https://lab.example
    DB_SSL_ENABLED: "true"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
web:
  replicas: 2
  env:
    REACT_APP_API_URL: https://lab.example/api/v2
ingress:
  enabled: true
  host: lab.example
